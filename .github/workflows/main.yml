name: Android - Firebase to pCloudy Appium Performance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PACKAGE: com.epam.mobitru
  PCLOUDY_DURATION: "30"
  PCLOUDY_APPIUM_URL: https://device.pcloudy.com/appiumcloud/wd/hub
  PCLOUDY_ENABLE_PERFORMANCE_DATA: "true"
  PYTHONUNBUFFERED: "1"

jobs:

  run-pcloudy-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate with Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'

      - name: Firebase - Get Access Token
        id: firebase-token
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Firebase - Access Token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"

      - name: Firebase - Fetch Latest Release
        id: firebase-release
        shell: bash
        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Firebase - Latest Release"
          echo "=========================================="

          PROJECT_NUMBER="$(
            printf '%s' "$FIREBASE_PROJECT_NUMBER" |
            tr -d '[:space:]'
          )"

          APP_ID="$(
            printf '%s' "$FIREBASE_APP_ID" |
            tr -d '[:space:]'
          )"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID does not look like Android Firebase App ID"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Invalid Firebase JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase release found"
            cat firebase-release.json
            exit 1
          fi

          echo "::add-mask::$DOWNLOAD_URL"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"

      - name: Firebase - Download APK
        shell: bash
        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Firebase - Download APK"
          echo "=========================================="

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Download URL is empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          ls -lh firebase-app.apk

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Verify APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"
          echo "APK verification successful"
          
      - name: pCloudy Authentication
        id: pcloudy-auth
        shell: bash
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "pCloudy Authentication"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "pCloudy authentication successful"
      
      - name: Fetch Target Devices
        shell: bash
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Fetch Target Devices"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{
                \"token\":\"${PCLOUDY_TOKEN}\",
                \"duration\":30,
                \"platform\":\"Android\",
                \"available_now\":true
              }" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "Available Android devices:"

          jq -r '
            .result.models[]?
            | select(.available == true)
            | select((.platform // "" | ascii_downcase) == "android")
            | "\(.full_name) | \(.display_name) | Android \(.version)"
          ' pcloudy-devices.json || true

      - name: Validate Target Devices
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Validate Target Devices"
          echo "=========================================="

          DEVICES_FILE=".github/config/devices.json"

          test -f "$DEVICES_FILE" || {
            echo "ERROR: $DEVICES_FILE not found"
            exit 1
          }

          jq empty "$DEVICES_FILE"

          ENABLED_COUNT="$(
            jq '[.devices[]? | select(.enabled == true)] | length' \
            "$DEVICES_FILE"
          )"

          if [ "$ENABLED_COUNT" -eq 0 ]; then
            echo "ERROR: No enabled devices configured"
            exit 1
          fi

          echo "Enabled devices: $ENABLED_COUNT"

          jq -r \
            '.devices[]? | select(.enabled == true) | .name' \
            "$DEVICES_FILE"
            
      - name: Upload APK to pCloudy
        id: pcloudy-upload
        shell: bash
        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Upload APK to pCloudy"
          echo "=========================================="

          HTTP_CODE="$(
            curl \
              --http1.1 \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              --output pcloudy-upload.json \
              --write-out "%{http_code}" \
              --request POST \
              --form "file=@firebase-app.apk" \
              --form "source_type=raw" \
              --form "token=${PCLOUDY_TOKEN}" \
              --form "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: pCloudy APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          cat pcloudy-upload.json | jq '.' || cat pcloudy-upload.json

          UPLOAD_FILENAME="$(
            jq -r '
              .result.file //
              .result.file_name //
              .result.filename //
              .result.fileName //
              .result.application_name //
              .result.applicationName //
              .result.name //
              .file //
              empty
            ' pcloudy-upload.json |
            head -n 1
          )"

          if [ -z "$UPLOAD_FILENAME" ] ||
             [ "$UPLOAD_FILENAME" = "null" ]; then
            echo "ERROR: Could not determine uploaded filename"
            cat pcloudy-upload.json
            exit 1
          fi

          echo "pCloudy Application:"
          echo "$UPLOAD_FILENAME"

          echo "filename=$UPLOAD_FILENAME" >> "$GITHUB_OUTPUT"

          echo "APK uploaded successfully"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Appium dependencies
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          pip install -r requirements.txt

          echo ""
          echo "Installed packages:"
          pip list

      - name: Run Sequential Tests
        shell: bash
        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}
          PCLOUDY_APPLICATION_NAME: ${{ steps.pcloudy-upload.outputs.filename }}
          PCLOUDY_APP_NAME: ${{ steps.pcloudy-upload.outputs.filename }}
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          PCLOUDY_APPIUM_URL: ${{ env.PCLOUDY_APPIUM_URL }}
          PCLOUDY_ENABLE_PERFORMANCE_DATA: "true"
          PCLOUDY_DURATION: ${{ env.PCLOUDY_DURATION }}
        run: |
          set -uo pipefail

          echo "=========================================="
          echo "Execute Tests on Devices"
          echo "=========================================="

          if [ -z "${PCLOUDY_APPLICATION_NAME:-}" ]; then
            echo "ERROR: pCloudy uploaded application name is empty"
            exit 1
          fi

          mkdir -p device-results performance-results

          SUMMARY_FILE="device-results/summary.tsv"

          printf 'DEVICE\tSTATUS\tREASON\n' > "$SUMMARY_FILE"

          TOTAL=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          while IFS= read -r DEVICE_NAME; do

            [ -n "$DEVICE_NAME" ] || continue

            TOTAL=$((TOTAL + 1))

            SAFE_NAME="$(
              printf '%s' "$DEVICE_NAME" |
              sed 's/[^A-Za-z0-9._-]/_/g'
            )"

            XML_FILE="performance-results/${SAFE_NAME}-junit.xml"
            LOG_FILE="performance-results/${SAFE_NAME}.log"

            echo ""
            echo "=========================================="
            echo "DEVICE ${TOTAL}: ${DEVICE_NAME}"
            echo "=========================================="

            CURRENT_DEVICES_FILE="performance-results/${SAFE_NAME}-availability.json"

            if ! curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 2 \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 60 \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{\"token\":\"${PCLOUDY_TOKEN}\",\"duration\":${PCLOUDY_DURATION},\"platform\":\"Android\",\"available_now\":true}" \
              "https://device.pcloudy.com/api/devices" \
              --output "$CURRENT_DEVICES_FILE"; then

              STATUS="FAILED"
              REASON="DEVICE_AVAILABILITY_CHECK_FAILED"

              FAILED=$((FAILED + 1))

              printf '%s\t%s\t%s\n' \
                "$DEVICE_NAME" "$STATUS" "$REASON" >> "$SUMMARY_FILE"

              continue
            fi

            FOUND="$(
              jq -r --arg DEVICE "$DEVICE_NAME" '
                .result.models[]?
                | select(.full_name == $DEVICE and .available == true)
                | select((.platform // "" | ascii_downcase) == "android")
                | .full_name
              ' "$CURRENT_DEVICES_FILE" |
              head -n 1
            )"

            if [ -z "$FOUND" ]; then

              STATUS="SKIPPED"
              REASON="DEVICE_NOT_AVAILABLE_AT_PRECHECK"

              SKIPPED=$((SKIPPED + 1))

              printf '%s\t%s\t%s\n' \
                "$DEVICE_NAME" "$STATUS" "$REASON" >> "$SUMMARY_FILE"

              echo "Device unavailable. Skipping."
              continue
            fi

            echo "Device available. Starting Appium test."

            set +e

            PCLOUDY_DEVICE="$DEVICE_NAME" \
            pytest \
              .github/automation/test_app_lifecycle.py \
              -v -s \
              --tb=short \
              --junitxml="$XML_FILE" \
              2>&1 | tee "$LOG_FILE"

            TEST_EXIT_CODE=${PIPESTATUS[0]}

            set -e

            if [ "$TEST_EXIT_CODE" -eq 0 ]; then

              STATUS="PASSED"
              REASON="PERF_AUTOMATION_COMPLETED"

              PASSED=$((PASSED + 1))

            else

              if grep -qi \
                "Ensure Android >=13 or iOS >=15 for appPerformance" \
                "$LOG_FILE"; then

                STATUS="FAILED"
                REASON="APPIUM_PERFORMANCE_CAPABILITY_ERROR"

                FAILED=$((FAILED + 1))

              elif grep -qi \
                "Requested device not available\|device is not available\|device not available" \
                "$LOG_FILE"; then

                STATUS="SKIPPED"
                REASON="DEVICE_NOT_AVAILABLE_DURING_SESSION"

                SKIPPED=$((SKIPPED + 1))

              else

                STATUS="FAILED"

                if grep -qi "ECONNREFUSED" "$LOG_FILE"; then
                  REASON="APPIUM_SESSION_CONNECTION_REFUSED"

                elif grep -qi \
                  "APPIUM_SESSION_FAILED\|Could not create pCloudy Appium session" \
                  "$LOG_FILE"; then

                  REASON="APPIUM_SESSION_FAILED"

                else
                  REASON="APPIUM_TEST_FAILED"
                fi

                FAILED=$((FAILED + 1))

              fi

            fi

            printf '%s\t%s\t%s\n' \
              "$DEVICE_NAME" "$STATUS" "$REASON" >> "$SUMMARY_FILE"

            echo "Device session/test finished."

          done < <(
            jq -r \
              '.devices[]? | select(.enabled == true) | .name' \
              .github/config/devices.json
          )

          if [ "$FAILED" -gt 0 ]; then
            FINAL_STATUS="FAILED"

          elif [ "$PASSED" -eq 0 ]; then
            FINAL_STATUS="NO_TESTS_EXECUTED"

          else
            FINAL_STATUS="SUCCESS"
          fi

          {
            echo "Final status: $FINAL_STATUS"
            echo "Total enabled devices: $TOTAL"
            echo "Passed: $PASSED"
            echo "Failed: $FAILED"
            echo "Skipped: $SKIPPED"
          } | tee device-results/final-summary.txt

          {
            echo "## pCloudy Multi-Device Test Summary"
            echo ""
            echo "- **Final status:** $FINAL_STATUS"
            echo "- **Enabled devices:** $TOTAL"
            echo "- **Passed:** $PASSED"
            echo "- **Failed:** $FAILED"
            echo "- **Skipped:** $SKIPPED"
          } >> "$GITHUB_STEP_SUMMARY"

          echo ""
          echo "Per-device summary:"
          column -t -s $'\t' "$SUMMARY_FILE" || cat "$SUMMARY_FILE"

          if [ "$FAILED" -gt 0 ]; then
            echo "FINAL_STATUS=FAILED"
            exit 1

          elif [ "$PASSED" -eq 0 ]; then
            echo "FINAL_STATUS=NO_TESTS_EXECUTED"
            exit 1

          fi

          echo "FINAL_STATUS=SUCCESS"

      - name: Collect Results
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          echo "=========================================="
          echo "Collect Results"
          echo "=========================================="

          mkdir -p performance-results device-results

          if [ -f device-results/summary.tsv ]; then
            cp device-results/summary.tsv \
              performance-results/device-summary.tsv
          fi

          if [ -f device-results/final-summary.txt ]; then
            cp device-results/final-summary.txt \
              performance-results/final-summary.txt
          fi

          echo "Result files:"
          find performance-results device-results \
            -maxdepth 2 \
            -type f \
            -print || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-pcloudy-results
          path: |
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json
            performance-results/
            device-results/
          if-no-files-found: warn
          retention-days: 7

