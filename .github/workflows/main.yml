name: Android - Firebase to pCloudy Appium Performance

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PACKAGE: com.epam.mobitru

  PCLOUDY_DURATION: "30"

  PCLOUDY_APPIUM_URL: https://device.pcloudy.com/appiumcloud/wd/hub

  PCLOUDY_ENABLE_PERFORMANCE_DATA: "true"

  PYTHONUNBUFFERED: "1"

jobs:

  # ============================================================
  # JOB
  # ============================================================

  appium-pcloudy:

    name: Firebase → pCloudy → Appium → Performance

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # STAGE 1 - CHECKOUT
      # ========================================================

      - name: STAGE 1 - Checkout repository
        uses: actions/checkout@v4


      # ========================================================
      # STAGE 2 - FIREBASE AUTHENTICATION
      # ========================================================

      - name: STAGE 2 - Authenticate with Firebase
        uses: google-github-actions/auth@v2

        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'


      # ========================================================
      # STAGE 3 - FIREBASE ACCESS TOKEN
      # ========================================================

      - name: STAGE 3 - Get Firebase access token
        id: firebase-token
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 3 - Firebase Access Token"
          echo "=========================================="

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          if [ -z "$ACCESS_TOKEN" ]; then
            echo "ERROR: Firebase access token is empty"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

          echo "Firebase authentication successful"


      # ========================================================
      # STAGE 4 - LATEST FIREBASE RELEASE
      # ========================================================

      - name: STAGE 4 - Get latest Firebase Android release
        id: firebase-release
        shell: bash

        env:
          FIREBASE_PROJECT_NUMBER: ${{ secrets.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          ACCESS_TOKEN: ${{ steps.firebase-token.outputs.access_token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 4 - Latest Firebase Release"
          echo "=========================================="

          PROJECT_NUMBER="$(
            printf '%s' "$FIREBASE_PROJECT_NUMBER" |
            tr -d '[:space:]'
          )"

          APP_ID="$(
            printf '%s' "$FIREBASE_APP_ID" |
            tr -d '[:space:]'
          )"

          if [ -z "$PROJECT_NUMBER" ]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER is empty"
            exit 1
          fi

          if ! [[ "$PROJECT_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "ERROR: FIREBASE_PROJECT_NUMBER must contain only numbers"
            exit 1
          fi

          if [ -z "$APP_ID" ]; then
            echo "ERROR: FIREBASE_APP_ID is empty"
            exit 1
          fi

          if [[ "$APP_ID" != *":android:"* ]]; then
            echo "ERROR: FIREBASE_APP_ID does not look like Android Firebase App ID"
            exit 1
          fi

          API_URL="https://firebaseappdistribution.googleapis.com/v1/projects/${PROJECT_NUMBER}/apps/${APP_ID}/releases"

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --get \
              --url "$API_URL" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              --header "Accept: application/json" \
              --data-urlencode "pageSize=1" \
              --data-urlencode "orderBy=createTime desc"
          )"

          printf '%s\n' "$RESPONSE" > firebase-release.json

          if ! printf '%s' "$RESPONSE" | jq empty >/dev/null 2>&1; then
            echo "ERROR: Invalid Firebase JSON"
            cat firebase-release.json
            exit 1
          fi

          DOWNLOAD_URL="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].binaryDownloadUri // empty'
          )"

          RELEASE_NAME="$(
            printf '%s' "$RESPONSE" |
            jq -r '.releases[0].name // empty'
          )"

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: No Firebase release found"
            cat firebase-release.json
            exit 1
          fi

          echo "::add-mask::$DOWNLOAD_URL"

          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Latest Firebase release:"
          echo "$RELEASE_NAME"


      # ========================================================
      # STAGE 5 - DOWNLOAD APK
      # ========================================================

      - name: STAGE 5 - Download APK from Firebase
        shell: bash

        env:
          DOWNLOAD_URL: ${{ steps.firebase-release.outputs.download_url }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 5 - Download APK"
          echo "=========================================="

          if [ -z "$DOWNLOAD_URL" ]; then
            echo "ERROR: Download URL is empty"
            exit 1
          fi

          curl \
            --fail-with-body \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 3 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 300 \
            "$DOWNLOAD_URL" \
            --output firebase-app.apk

          if [ ! -s firebase-app.apk ]; then
            echo "ERROR: APK download failed"
            exit 1
          fi

          ls -lh firebase-app.apk


      # ========================================================
      # STAGE 6 - VERIFY APK
      # ========================================================

      - name: STAGE 6 - Verify APK
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 6 - Verify APK"
          echo "=========================================="

          file firebase-app.apk

          APK_SIZE="$(stat -c%s firebase-app.apk)"

          if [ "$APK_SIZE" -le 0 ]; then
            echo "ERROR: APK is empty"
            exit 1
          fi

          echo "APK size: ${APK_SIZE} bytes"

          echo "APK verification successful"


      # ========================================================
      # STAGE 7 - PCLOUDY AUTHENTICATION
      # ========================================================

      - name: STAGE 7 - Authenticate with pCloudy
        id: pcloudy-auth
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 7 - pCloudy Authentication"
          echo "=========================================="

          if [ -z "$PCLOUDY_EMAIL" ]; then
            echo "ERROR: PCLOUDY_EMAIL is empty"
            exit 1
          fi

          if [ -z "$PCLOUDY_ACCESS_KEY" ]; then
            echo "ERROR: PCLOUDY_ACCESS_KEY is empty"
            exit 1
          fi

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              -u "${PCLOUDY_EMAIL}:${PCLOUDY_ACCESS_KEY}" \
              "https://device.pcloudy.com/api/access"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-auth.json

          TOKEN="$(
            printf '%s' "$RESPONSE" |
            jq -r '.result.token // empty'
          )"

          if [ -z "$TOKEN" ]; then
            echo "ERROR: Could not extract pCloudy token"
            cat pcloudy-auth.json
            exit 1
          fi

          echo "::add-mask::$TOKEN"

          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

          echo "pCloudy authentication successful"


      # ========================================================
      # STAGE 8 - DEVICE LIST
      # ========================================================

      - name: STAGE 8 - Get pCloudy Android devices
        shell: bash

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 8 - pCloudy Device List"
          echo "=========================================="

          RESPONSE="$(
            curl \
              --silent \
              --show-error \
              --fail-with-body \
              --retry 5 \
              --retry-delay 3 \
              --retry-all-errors \
              --request POST \
              --header "Content-Type: application/json" \
              --data "{
                \"token\":\"${PCLOUDY_TOKEN}\",
                \"duration\":30,
                \"platform\":\"Android\",
                \"available_now\":true
              }" \
              "https://device.pcloudy.com/api/devices"
          )"

          printf '%s\n' "$RESPONSE" > pcloudy-devices.json

          echo ""
          echo "Available Android devices:"

          jq -r '
            .result.models[]?
            | select(.available == true)
            | select(
                (.platform // "" | ascii_downcase) == "android"
              )
            | "\(.full_name) | \(.display_name) | Android \(.version)"
          ' pcloudy-devices.json || true


      # ========================================================
      # STAGE 9 - DEVICE VALIDATION
      # ========================================================

      - name: STAGE 9 - Validate all configured devices
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 9 - Validate all configured devices"
          echo "=========================================="

          DEVICES_FILE="config/devices.json"
          test -f "$DEVICES_FILE" || { echo "ERROR: $DEVICES_FILE not found"; exit 1; }
          jq empty "$DEVICES_FILE"

          ENABLED_COUNT="$(jq '[.devices[]? | select(.enabled == true)] | length' "$DEVICES_FILE")"
          if [ "$ENABLED_COUNT" -eq 0 ]; then
            echo "ERROR: No enabled devices configured in $DEVICES_FILE"
            exit 1
          fi

          mkdir -p device-results performance-results
          printf 'DEVICE\tSTATUS\tREASON\n' > device-results/summary.tsv
          : > device-results/device-results.log

          echo "Enabled devices in config/devices.json: $ENABLED_COUNT"
          jq -r '.devices[]? | select(.enabled == true) | .name' "$DEVICES_FILE"
          echo "All enabled devices will be processed sequentially in Stage 11."


      # ========================================================
      # STAGE 10 - UPLOAD APK
      # ========================================================

      - name: STAGE 10 - Upload APK to pCloudy
        id: pcloudy-upload
        shell: bash

        env:
          PCLOUDY_TOKEN: ${{ steps.pcloudy-auth.outputs.token }}

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 10 - Upload APK to pCloudy"
          echo "=========================================="

          HTTP_CODE="$(
            curl \
              --http1.1 \
              --silent \
              --show-error \
              --location \
              --retry 5 \
              --retry-delay 5 \
              --retry-all-errors \
              --connect-timeout 30 \
              --max-time 300 \
              --output pcloudy-upload.json \
              --write-out "%{http_code}" \
              --request POST \
              --form "file=@firebase-app.apk" \
              --form "source_type=raw" \
              --form "token=${PCLOUDY_TOKEN}" \
              --form "filter=all" \
              "https://device.pcloudy.com/api/upload_file"
          )"

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: pCloudy APK upload failed"
            cat pcloudy-upload.json
            exit 1
          fi

          echo ""
          echo "Upload response:"
          cat pcloudy-upload.json | jq '.' \
            || cat pcloudy-upload.json

          UPLOAD_FILENAME="$(
            jq -r '
              .result.file //
              .result.file_name //
              .result.filename //
              .result.fileName //
              .result.application_name //
              .result.applicationName //
              .result.name //
              .file //
              empty
            ' pcloudy-upload.json |
            head -n 1
          )"

          if [ -z "$UPLOAD_FILENAME" ] ||
             [ "$UPLOAD_FILENAME" = "null" ]; then

            echo "ERROR: Could not determine uploaded filename"

            cat pcloudy-upload.json

            exit 1
          fi

          echo ""
          echo "pCloudy Application:"
          echo "$UPLOAD_FILENAME"

          echo "filename=$UPLOAD_FILENAME" >> "$GITHUB_OUTPUT"

          echo "APK uploaded successfully"


      # ========================================================
      # STAGE 11 - PYTHON SETUP
      # ========================================================

      - name: STAGE 11 - Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ========================================================
      # STAGE 11 - INSTALL APPIUM DEPENDENCIES
      # ========================================================

      - name: STAGE 11 - Install Appium dependencies
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 11 - Appium Dependencies"
          echo "=========================================="

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          pip install -r requirements.txt

          echo ""
          echo "Installed packages:"
          pip list


      # ========================================================
      # STAGE 11 - SEQUENTIAL APPIUM AUTOMATION
      # ========================================================

      - name: STAGE 11 - Run pCloudy Appium tests sequentially
        id: appium-test
        shell: bash

        env:
          PCLOUDY_EMAIL: ${{ secrets.PCLOUDY_EMAIL }}
          PCLOUDY_ACCESS_KEY: ${{ secrets.PCLOUDY_ACCESS_KEY }}
          PCLOUDY_APPLICATION_NAME: ${{ steps.pcloudy-upload.outputs.filename }}
          PCLOUDY_APP_NAME: ${{ steps.pcloudy-upload.outputs.filename }}
          APP_PACKAGE: ${{ env.APP_PACKAGE }}
          PCLOUDY_APPIUM_URL: ${{ env.PCLOUDY_APPIUM_URL }}
          PCLOUDY_ENABLE_PERFORMANCE_DATA: "true"
          PCLOUDY_DURATION: ${{ env.PCLOUDY_DURATION }}

        run: |
          set -uo pipefail

          echo "=========================================="
          echo "STAGE 11 - Sequential pCloudy Appium Tests"
          echo "=========================================="

          if [ -z "${PCLOUDY_APPLICATION_NAME:-}" ]; then
            echo "ERROR: pCloudy uploaded application name is empty"
            exit 1
          fi

          mkdir -p device-results performance-results
          SUMMARY_FILE="device-results/summary.tsv"
          if [ ! -s "$SUMMARY_FILE" ]; then
            printf 'DEVICE\tSTATUS\tREASON\n' > "$SUMMARY_FILE"
          fi

          TOTAL=0
          PASSED=0
          FAILED=0
          SKIPPED=0

          while IFS= read -r DEVICE_NAME; do
            [ -n "$DEVICE_NAME" ] || continue
            TOTAL=$((TOTAL + 1))
            SAFE_NAME="$(printf '%s' "$DEVICE_NAME" | sed 's/[^A-Za-z0-9._-]/_/g')"
            XML_FILE="performance-results/${SAFE_NAME}-junit.xml"
            LOG_FILE="performance-results/${SAFE_NAME}.log"

            echo ""
            echo "=========================================="
            echo "DEVICE ${TOTAL}: ${DEVICE_NAME}"
            echo "=========================================="

            FOUND="$(jq -r --arg DEVICE "$DEVICE_NAME" '
              .result.models[]?
              | select(.full_name == $DEVICE and .available == true)
              | select((.platform // "" | ascii_downcase) == "android")
              | .full_name
            ' pcloudy-devices.json | head -n 1)"

            if [ -z "$FOUND" ]; then
              STATUS="SKIPPED"
              REASON="DEVICE_NOT_AVAILABLE_AT_PRECHECK"
              SKIPPED=$((SKIPPED + 1))
              printf '%s\t%s\t%s\n' "$DEVICE_NAME" "$STATUS" "$REASON" >> "$SUMMARY_FILE"
              printf '%s | %s | %s\n' "$DEVICE_NAME" "$STATUS" "$REASON" | tee -a device-results/device-results.log
              echo "Skipping this device and continuing to the next configured device."
              continue
            fi

            echo "Device is available. Starting Appium lifecycle test."
            set +e
            PCLOUDY_DEVICE="$DEVICE_NAME" \
            pytest \
              automation/test_app_lifecycle.py \
              -v -s --tb=short \
              --junitxml="$XML_FILE" \
              2>&1 | tee "$LOG_FILE"
            TEST_EXIT_CODE=${PIPESTATUS[0]}
            set -e

            if [ "$TEST_EXIT_CODE" -eq 0 ]; then
              STATUS="PASSED"
              REASON="PERF_AUTOMATION_COMPLETED"
              PASSED=$((PASSED + 1))
            else
              STATUS="FAILED"
              if grep -qi "ECONNREFUSED" "$LOG_FILE"; then
                REASON="APPIUM_SESSION_CONNECTION_REFUSED"
              elif grep -qi "APPIUM_SESSION_FAILED\|Could not create pCloudy Appium session\|Requested device not available" "$LOG_FILE"; then
                REASON="APPIUM_SESSION_FAILED"
              else
                REASON="APPIUM_TEST_FAILED"
              fi
              FAILED=$((FAILED + 1))
            fi

            printf '%s\t%s\t%s\n' "$DEVICE_NAME" "$STATUS" "$REASON" >> "$SUMMARY_FILE"
            printf '%s | %s | %s\n' "$DEVICE_NAME" "$STATUS" "$REASON" | tee -a device-results/device-results.log
            echo "Device session/test finished. Moving to the next device."
          done < <(jq -r '.devices[]? | select(.enabled == true) | .name' config/devices.json)

          {
            echo "Total enabled devices: $TOTAL"
            echo "Passed: $PASSED"
            echo "Failed: $FAILED"
            echo "Skipped (unavailable at precheck): $SKIPPED"
          } | tee device-results/final-summary.txt

          echo ""
          echo "Per-device summary:"
          column -t -s $'\t' "$SUMMARY_FILE" || cat "$SUMMARY_FILE"

          # Fail only after every enabled device has had its turn.
          if [ "$FAILED" -gt 0 ]; then
            echo "One or more device tests failed; all configured devices were still processed."
            exit 1
          fi


      # ========================================================
      # STAGE 12 - PERFORMANCE RESULTS
      # ========================================================

      - name: STAGE 12 - Collect per-device results
        if: always()
        shell: bash

        run: |
          set -euo pipefail

          echo "=========================================="
          echo "STAGE 12 - Collect per-device results"
          echo "=========================================="

          mkdir -p performance-results device-results
          echo "Performance data collection capability: pCloudy_EnablePerformanceData=true"

          if [ -f device-results/summary.tsv ]; then
            cp device-results/summary.tsv performance-results/device-summary.tsv
          fi
          if [ -f device-results/final-summary.txt ]; then
            cp device-results/final-summary.txt performance-results/final-summary.txt
          fi

          echo "Result files:"
          find performance-results device-results -maxdepth 2 -type f -print || true


      # ========================================================
      # STAGE 13 - UPLOAD RESULTS
      # ========================================================

      - name: STAGE 13 - Upload Results
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: android-pcloudy-results

          path: |
            appium-results.xml
            firebase-release.json
            pcloudy-auth.json
            pcloudy-devices.json
            pcloudy-upload.json
            performance-results/
            device-results/

          if-no-files-found: warn

          retention-days: 7
